<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Guardian | Secure Location Portal</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #3b82f6;
            --secondary: #64748b;
            --status-active: #10b981;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            z-index: 1000;
            pointer-events: none;
        }

        .status-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--border);
            max-width: 380px;
            pointer-events: auto;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .logo-circle {
            width: 44px;
            height: 44px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 { 
            margin: 0; 
            font-size: 16px; 
            font-weight: 700; 
            letter-spacing: 0.5px; 
            color: var(--text);
            text-transform: uppercase;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--status-active);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--status-active);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--status-active);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label { 
            font-size: 11px; 
            color: var(--text-muted); 
            font-weight: 500; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value { 
            font-size: 15px; 
            font-weight: 600; 
            color: var(--text);
        }

        .pulse-marker {
            width: 18px;
            height: 18px;
            background: var(--primary);
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            70% { transform: scale(2.5); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        .error-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            text-align: center;
            padding: 40px;
        }

        .error-card {
            max-width: 400px;
        }

        .error-card h2 { margin-bottom: 12px; font-weight: 700; }
        .error-card p { color: var(--text-muted); line-height: 1.6; }

        /* Map styling */
        .leaflet-container {
            background: #0b1221 !important;
        }
    </style>
</head>
<body>

    <div id="error-overlay" class="error-screen" style="display: none;">
        <div class="error-card">
            <h2 id="error-title">Secure Portal</h2>
            <p id="error-msg">Please access this page using the verified link provided via the SOS system.</p>
        </div>
    </div>

    <div class="overlay">
        <div class="status-card">
            <div class="header">
                <div class="logo-circle">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <div>
                    <h1>SOS Guardian</h1>
                    <div class="status-badge">
                        <div class="status-dot"></div>
                        Live Location Active
                    </div>
                </div>
            </div>
            
            <div class="info-grid">
                <div class="info-item">
                    <span class="label">Identity</span>
                    <span class="value" id="name-val">Syncing...</span>
                </div>
                <div class="info-item">
                    <span class="label">Last Updated</span>
                    <span class="value" id="time-val">---</span>
                </div>
                <div class="info-item">
                    <span class="label">Current Coordinates</span>
                    <span class="value" id="coord-val">Awaiting signal...</span>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFrLFpJdfQsHi0Q_vCSz-M6jtAWJiq5uY",
            authDomain: "sos-guardian-22ba2.firebaseapp.com",
            databaseURL: "https://sos-guardian-22ba2-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "sos-guardian-22ba2",
            storageBucket: "sos-guardian-22ba2.firebasestorage.app",
            messagingSenderId: "725811688161",
            appId: "1:725811688161:web:8ae2c04c7ce7fc17213da0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const trackingId = urlParams.get('id');

        if (!trackingId) {
            document.getElementById('error-overlay').style.display = 'flex';
        } else {
            initTracking(trackingId);
        }

        function initTracking(id) {
            const map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            let marker = null;
            let path = L.polyline([], { color: '#3b82f6', weight: 4, opacity: 0.5, lineCap: 'round' }).addTo(map);

            const trackingRef = ref(db, 'emergencies/' + id);
            onValue(trackingRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    document.getElementById('error-title').innerText = "Session Completed";
                    document.getElementById('error-msg').innerText = "This tracking session is no longer active.";
                    document.getElementById('error-overlay').style.display = 'flex';
                    return;
                }

                const lat = data.current.lat;
                const lng = data.current.lng;
                const name = data.name;
                const lastSeen = new Date(data.last_seen).toLocaleTimeString();

                document.getElementById('name-val').innerText = name;
                document.getElementById('time-val').innerText = lastSeen;
                document.getElementById('coord-val').innerText = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

                const pos = [lat, lng];

                if (!marker) {
                    marker = L.marker(pos, {
                        icon: L.divIcon({
                            className: 'custom-div-icon',
                            html: "<div class='pulse-marker'></div>",
                            iconSize: [18, 18],
                            iconAnchor: [9, 9]
                        })
                    }).addTo(map);
                    map.setView(pos, 16);
                } else {
                    marker.setLatLng(pos);
                }

                path.addLatLng(pos);
                map.panTo(pos, { animate: true, duration: 1.0 });
            });
        }
    </script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
